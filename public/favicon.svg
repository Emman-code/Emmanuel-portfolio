<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b08d57" />
      <stop offset="50%" stop-color="#c8a879" />
      <stop offset="100%" stop-color="#8a6a3d" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>
  </defs>
  
  <!-- Light Theme Favicon Container -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#bgGrad)" stroke="rgba(15,23,42,0.12)" stroke-width="2.5" filter="url(#shadow)" />
  <rect x="8" y="8" width="84" height="84" rx="22" fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="1.8" />
  
  <!-- Accent dot -->
  <circle cx="76" cy="24" r="5" fill="#b08d57" />
  
  <!-- EJ Monogram -->
  <g transform="translate(48, 54)" text-anchor="middle" dominant-baseline="central">
    <text font-family="'Clash Display', 'Satoshi', 'Inter', system-ui, sans-serif" font-weight="700" font-size="44" letter-spacing="-2">
      <tspan fill="url(#bronzeGrad)">E</tspan><tspan fill="#0f172a">J</tspan>
    </text>
  </g>
</svg>
